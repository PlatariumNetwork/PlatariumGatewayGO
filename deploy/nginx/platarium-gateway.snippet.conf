# Generated at deploy time by scripts/ensure-nginx.sh from .env.nginx
# (placeholders: __REST_PORT__ __WS_PORT__). Do not commit host-specific copies.

# BEGIN PLATARIUM_GATEWAY_PROXY
location /ws {
    proxy_pass http://127.0.0.1:__WS_PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
    proxy_buffering off;
    proxy_cache off;
}

location / {
    proxy_pass http://127.0.0.1:__REST_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}
# END PLATARIUM_GATEWAY_PROXY
